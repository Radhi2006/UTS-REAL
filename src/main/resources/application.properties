spring.application.name=UTS-REAL
server.port=8080

# Database H2 (disimpan di folder ./data)
spring.datasource.url=jdbc:h2:file:./data/camunda-db;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true

# Camunda: user admin untuk Cockpit / Tasklist / Admin (http://localhost:8080/camunda)
camunda.bpm.admin-user.id=demo
camunda.bpm.admin-user.password=demo
camunda.bpm.admin-user.first-name=Demo
camunda.bpm.filter.create=Semua Task
camunda.bpm.history-level=full
